<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CardioMonitor</title>
  <desc id="desc">An abstract ECG trace crosses a dark panel labeled ECG, PULSE, and SpO2</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101d2b"/>
      <stop offset="1" stop-color="#172937"/>
    </linearGradient>
    <linearGradient id="signal" x2="1">
      <stop stop-color="#54d7ce"/>
      <stop offset=".52" stop-color="#ff6373"/>
      <stop offset="1" stop-color="#54d7ce"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#446073" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="312" rx="20" fill="url(#grid)"/>
  <circle cx="90" cy="66" r="8" fill="#ff6373"/>
  <text x="112" y="73" fill="#dce8ed" font-family="Arial, sans-serif" font-size="20" letter-spacing="4">CARDIOMONITOR</text>
  <text x="87" y="135" fill="#dce8ed" font-family="Arial, sans-serif" font-size="45" font-weight="700">Listen to the signal.</text>
  <text x="89" y="171" fill="#9fbac4" font-family="Arial, sans-serif" font-size="19">ECG  /  PULSE  /  SpO₂  /  LOCAL HISTORY</text>
  <path d="M88 245 H230 L252 245 L271 218 L292 284 L318 171 L341 266 L364 245 H494 L514 245 L530 224 L550 263 L574 201 L597 250 L620 245 H719 L742 245 L761 218 L782 284 L808 171 L831 266 L854 245 H1110" fill="none" stroke="#4b6071" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" opacity=".25"/>
  <path d="M88 245 H230 L252 245 L271 218 L292 284 L318 171 L341 266 L364 245 H494 L514 245 L530 224 L550 263 L574 201 L597 250 L620 245 H719 L742 245 L761 218 L782 284 L808 171 L831 266 L854 245 H1110" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="89" y="313" fill="#89aab6" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">ESP32-C3  ·  ON-DEVICE PROCESSING  ·  MICROSD</text>
</svg>
